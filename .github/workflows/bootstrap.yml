name: Bootstrap repository

on:
  push:
    paths:
      - 'bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk* | base64 -d > /tmp/acm-project.tar.gz
          tar -xzf /tmp/acm-project.tar.gz
          rm -rf bootstrap

      - name: Commit source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Build Cron Manager v0.1.0"
          git push
